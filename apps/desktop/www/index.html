<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>bundle-grep</title>
    <style>
      body { font: 14px/1.5 system-ui, sans-serif; margin: 16px; }
      input { width: 100%; box-sizing: border-box; padding: 6px 8px; font: inherit; }
      pre { white-space: pre-wrap; font: 12px/1.5 ui-monospace, monospace; }
    </style>
  </head>
  <body>
    <form id="form"><input id="query" placeholder="Search, e.g. useState language:typescript" autofocus /></form>
    <pre id="out"></pre>
    <script type="module">
      const token = await window.bundleGrepToken()
      const out = document.getElementById('out')
      let running

      document.getElementById('form').addEventListener('submit', async event => {
        event.preventDefault()
        running?.abort()
        running = new AbortController()
        out.textContent = ''
        const query = document.getElementById('query').value
        const response = await fetch(`/api/search?q=${encodeURIComponent(query)}`, {
          headers: { 'x-bundle-grep-token': token },
          signal: running.signal,
        }).catch(() => undefined)
        if (!response) return
        if (!response.ok) {
          out.textContent = (await response.json()).error.message
          return
        }
        const reader = response.body.pipeThrough(new TextDecoderStream()).getReader()
        let buffer = ''
        for (;;) {
          const { value, done } = await reader.read().catch(() => ({ done: true }))
          if (done) break
          buffer += value
          const lines = buffer.split('\n')
          buffer = lines.pop()
          for (const line of lines) {
            const event = JSON.parse(line)
            if (event.type === 'file') {
              out.textContent += `${event.repo}/${event.path}\n`
              for (const match of event.lines) out.textContent += `  ${match.number}: ${match.text}\n`
            } else if (event.type === 'repo-error') {
              out.textContent += `error: ${event.repo}: ${event.error.message}\n`
            } else if (event.type === 'done') {
              out.textContent += `\n${event.totalFiles} files\n`
            }
          }
        }
      })
    </script>
  </body>
</html>
