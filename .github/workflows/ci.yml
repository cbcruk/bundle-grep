name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    # Search leans on git features that vary by build — PCRE support in
    # particular — so both the Linux git and Apple's git are exercised.
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      # Keep in step with release.yml and the package's engines.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Report git
        run: git --version

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Check documentation
        run: pnpm docs:check

      - name: Build
        run: pnpm build && pnpm build:web

      - name: Test
        run: pnpm test

      - name: Smoke test the package
        run: |
          pnpm --filter bundle-grep pack --pack-destination "$RUNNER_TEMP"
          npm install --global --prefix "$RUNNER_TEMP/prefix" "$RUNNER_TEMP"/bundle-grep-*.tgz
          scripts/smoke-test.sh "$RUNNER_TEMP/prefix/bin/bundle-grep"
