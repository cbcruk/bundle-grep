name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    # Search leans on git features that vary by build — PCRE support in
    # particular — so both the Linux git and Apple's git are exercised.
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: pnpm install --frozen-lockfile

      - name: Report git
        run: git --version

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Check documentation
        run: pnpm docs:check

      - name: Test
        run: pnpm test
