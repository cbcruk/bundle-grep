name: Release

on:
  push:
    tags: ['v*']
  pull_request:
    paths: [.github/workflows/release.yml, scripts/smoke-test.sh, packages/**, apps/**, pnpm-lock.yaml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pack:
    name: pack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Check the tag against the version
        id: version
        run: |
          version=$(node -p 'require("./packages/cli/package.json").version')
          if [[ $GITHUB_REF_TYPE == tag && $GITHUB_REF_NAME != "v$version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match packages/cli version $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build the UI
        run: pnpm build:ui

      - name: Check
        run: pnpm typecheck && pnpm lint && pnpm docs:check && pnpm test

      # prepack builds the CLI bundle around the UI built above.
      - name: Pack
        run: |
          mkdir out
          pnpm --filter bundle-grep pack --pack-destination "$PWD/out"
          cd out && sha256sum *.tgz > SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: package
          path: out/

    outputs:
      version: ${{ steps.version.outputs.version }}

  smoke:
    name: smoke ${{ matrix.os }}
    needs: pack
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: actions/download-artifact@v4
        with:
          name: package
          path: out

      - name: Smoke test
        run: |
          npm install --global --prefix "$RUNNER_TEMP/prefix" ./out/bundle-grep-*.tgz
          scripts/smoke-test.sh "$RUNNER_TEMP/prefix/bin/bundle-grep" "${{ needs.pack.outputs.version }}"

  release:
    name: release
    needs: [pack, smoke]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - uses: actions/download-artifact@v4
        with:
          name: package
          path: out

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          tag=()
          if [[ $GITHUB_REF_NAME == *-* ]]; then tag=(--tag next); fi
          npm publish ./out/bundle-grep-*.tgz --access public "${tag[@]}"

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=()
          if [[ $GITHUB_REF_NAME == *-* ]]; then prerelease=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" out/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes --verify-tag "${prerelease[@]}"
