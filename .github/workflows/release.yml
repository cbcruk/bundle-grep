name: Release

on:
  push:
    tags: ['v*']
  pull_request:
    paths: [.github/workflows/release.yml, scripts/smoke-test.sh, packages/**, apps/**, pnpm-lock.yaml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      # Pinned so a tag always ships the runtime it was verified with.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - run: pnpm install --frozen-lockfile

      - name: Check the tag against the version
        id: version
        run: |
          version=$(bun -p 'require("./packages/cli/package.json").version')
          if [[ $GITHUB_REF_TYPE == tag && $GITHUB_REF_NAME != "v$version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match packages/cli version $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Check
        run: pnpm typecheck && pnpm lint && pnpm docs:check && pnpm test

      - name: Build UI
        run: pnpm build:ui

      # Bun cross-compiles every target from one runner; the smoke job then
      # runs the binaries a hosted runner can execute. The x64 builds use
      # Bun's baseline runtime, which does not need AVX2.
      - name: Compile
        run: |
          mkdir -p out
          for target in darwin-arm64 darwin-x64 linux-x64 linux-arm64; do
            mkdir -p "build/$target"
            runtime=$target
            if [[ $target == *-x64 ]]; then runtime=$target-baseline; fi
            bun build --compile --target="bun-$runtime" packages/cli/src/main.ts --outfile "build/$target/bundle-grep"
            tar -czf "out/bundle-grep-v${{ steps.version.outputs.version }}-$target.tar.gz" -C "build/$target" bundle-grep
          done
          cd out && sha256sum *.tar.gz > SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: out/

    outputs:
      version: ${{ steps.version.outputs.version }}

  smoke:
    name: smoke ${{ matrix.target }}
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64
          - os: macos-latest
            target: darwin-arm64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: release
          path: out

      - name: Smoke test
        run: |
          mkdir bin
          tar -xzf "out/bundle-grep-v${{ needs.build.outputs.version }}-${{ matrix.target }}.tar.gz" -C bin
          scripts/smoke-test.sh bin/bundle-grep "${{ needs.build.outputs.version }}"

  release:
    name: release
    needs: [build, smoke]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release
          path: out

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=()
          if [[ $GITHUB_REF_NAME == *-* ]]; then prerelease=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" out/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes --verify-tag "${prerelease[@]}"
